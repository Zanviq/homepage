services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env # written by TwoMES Hosting on deploy; optional locally
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      # Markdown + images persist here. On the Pi, TwoMES Hosting sets
      # HOSTING_DATA_DIR to /mnt/homepage (existing ext4 loop image on the HDD).
      - ${HOSTING_DATA_DIR:-./data}:/data
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # Next.js rewrites /api/* to this internal address (see next.config.ts)
      BACKEND_URL: http://backend:8000
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
